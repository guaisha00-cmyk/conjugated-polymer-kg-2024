<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>共轭聚合物快检知识图谱</title>
  <style>
    :root {
      --bg: #edf1f5;
      --panel: #ffffff;
      --canvas: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --faint: #98a2b3;
      --border: #dce3ea;
      --border-strong: #cbd5e1;
      --accent: #0f766e;
      --accent-soft: #e7f5f2;
      --warning: #b45309;
      --warning-soft: #fff7ed;
      --path: #d97706;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      --radius: 8px;
      --topbar: 68px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(15, 118, 110, 0.38);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: var(--topbar) minmax(0, 1fr);
    }

    .topbar {
      position: relative;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(290px, 1fr) minmax(280px, 520px) minmax(310px, 1fr);
      align-items: center;
      gap: 20px;
      height: var(--topbar);
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: #0f766e;
      border-radius: 8px;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      overflow: hidden;
      color: #111827;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #f8fafc;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .search-box:focus-within {
      border-color: #0f766e;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.09);
    }

    .search-icon {
      flex: 0 0 auto;
      margin-left: 12px;
      color: #7b8794;
    }

    .search-box input {
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 0 12px 0 9px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 13.5px;
    }

    .search-box input::placeholder {
      color: #8b96a5;
    }

    .search-results {
      position: absolute;
      top: 46px;
      left: 0;
      right: 0;
      z-index: 90;
      display: none;
      max-height: 360px;
      overflow: auto;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #ffffff;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.16);
    }

    .search-results.open {
      display: block;
    }

    .search-result {
      width: 100%;
      display: grid;
      grid-template-columns: 7px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border: 0;
      border-radius: 5px;
      color: var(--ink);
      background: transparent;
      text-align: left;
    }

    .search-result:hover,
    .search-result.active {
      background: #f1f5f9;
    }

    .result-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .result-label {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-type {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .search-empty {
      padding: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 12.5px;
    }

    .top-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .quick-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-right: 8px;
      color: var(--muted);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .quick-stat strong {
      margin-right: 3px;
      color: #344054;
      font-size: 13px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: #344054;
      background: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
    }

    .button:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .button.primary {
      border-color: #0f766e;
      color: #ffffff;
      background: #0f766e;
    }

    .button.primary:hover {
      border-color: #0b5f59;
      background: #0b5f59;
    }

    .button.ghost {
      border-color: transparent;
      color: var(--muted);
      background: transparent;
    }

    .button.ghost:hover {
      color: var(--ink);
      background: #f1f5f9;
    }

    .button.small {
      height: 30px;
      padding: 0 9px;
      font-size: 11.5px;
    }

    .icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr) 326px;
    }

    .left-panel,
    .details-panel {
      position: relative;
      z-index: 20;
      min-height: 0;
      background: var(--panel);
    }

    .left-panel {
      overflow-y: auto;
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    .details-panel {
      overflow-y: auto;
      border-left: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    .panel-section {
      padding: 17px 18px;
      border-bottom: 1px solid #edf1f5;
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-title {
      margin: 0;
      color: #344054;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-meta {
      color: var(--faint);
      font-size: 11px;
    }

    .type-list {
      display: grid;
      gap: 2px;
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 18px 9px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 7px;
      border-radius: 5px;
      cursor: pointer;
    }

    .type-toggle:hover {
      background: #f8fafc;
    }

    .type-toggle input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #0f766e;
    }

    .type-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .type-name {
      color: #344054;
      font-size: 12.5px;
      font-weight: 500;
    }

    .type-count {
      color: var(--faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .path-form {
      display: grid;
      gap: 9px;
    }

    .field {
      position: relative;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 35px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      color: var(--ink);
      background: #ffffff;
      font-size: 12px;
    }

    .field input:focus {
      border-color: #0f766e;
      outline: 0;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.08);
    }

    .path-buttons {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      margin-top: 1px;
    }

    .path-result {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #fde8c7;
      border-radius: 6px;
      background: #fffbf5;
    }

    .path-result.visible {
      display: block;
    }

    .path-result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .path-result-title {
      color: #9a3412;
      font-size: 11.5px;
      font-weight: 700;
    }

    .path-result-body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      color: #7c2d12;
      font-size: 11px;
      line-height: 1.6;
    }

    .path-step {
      color: #7c2d12;
      font-weight: 600;
    }

    .path-arrow {
      color: #ea8a3c;
    }

    .conflict-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px;
      border: 1px solid #e6eaf0;
      border-radius: 6px;
      background: #fbfcfe;
    }

    .conflict-icon {
      flex: 0 0 auto;
      margin-top: 1px;
      color: var(--warning);
    }

    .conflict-copy {
      min-width: 0;
      flex: 1;
    }

    .conflict-title {
      color: #344054;
      font-size: 12px;
      font-weight: 700;
    }

    .conflict-detail {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .conflict-actions {
      margin-top: 8px;
    }

    .agent-list {
      display: grid;
      gap: 8px;
    }

    .agent-row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
    }

    .agent-dot {
      width: 7px;
      height: 7px;
      margin-top: 5px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 3px #dcfce7;
    }

    .agent-name {
      color: #475467;
      font-size: 11.5px;
      font-weight: 600;
    }

    .agent-status {
      margin-top: 1px;
      color: var(--faint);
      font-size: 10.5px;
      line-height: 1.35;
    }

    .agent-badge {
      margin-top: 1px;
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: var(--canvas);
      background-image: radial-gradient(circle, rgba(100, 116, 139, 0.17) 0.7px, transparent 0.8px);
      background-size: 18px 18px;
    }

    #graphCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #graphCanvas.dragging {
      cursor: grabbing;
    }

    .stage-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .stage-title {
      min-width: 0;
      padding: 7px 10px;
      border: 1px solid rgba(203, 213, 225, 0.82);
      border-radius: 5px;
      color: #475467;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
      backdrop-filter: blur(8px);
      font-size: 11.5px;
      font-weight: 600;
    }

    .stage-title strong {
      color: #1f2937;
    }

    .graph-toolbar {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(8px);
    }

    .tool-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #475467;
      background: transparent;
    }

    .tool-button:hover {
      color: #111827;
      background: #f1f5f9;
    }

    .tool-button.active {
      color: #0f766e;
      background: #e7f5f2;
    }

    .tool-separator {
      width: 1px;
      height: 19px;
      margin: 0 2px;
      background: var(--border);
    }

    .stage-status {
      position: absolute;
      left: 16px;
      bottom: 17px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid rgba(203, 213, 225, 0.72);
      border-radius: 5px;
      color: #667085;
      background: rgba(255, 255, 255, 0.88);
      font-size: 10.5px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .status-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }

    .node-tooltip {
      position: fixed;
      z-index: 80;
      display: none;
      max-width: 280px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.93);
      box-shadow: var(--shadow);
      pointer-events: none;
      font-size: 11.5px;
      line-height: 1.45;
    }

    .node-tooltip.visible {
      display: block;
    }

    .tooltip-label {
      font-weight: 700;
    }

    .tooltip-meta {
      margin-top: 2px;
      color: #cbd5e1;
      font-size: 10.5px;
    }

    .details-empty {
      position: sticky;
      top: 0;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .empty-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: #94a3b8;
      background: #f8fafc;
    }

    .empty-title {
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .empty-copy {
      max-width: 210px;
      margin: 6px auto 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.55;
    }

    .details-content {
      display: none;
    }

    .details-content.visible {
      display: block;
    }

    .details-head {
      padding: 18px;
      border-bottom: 1px solid #edf1f5;
    }

    .entity-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 9px;
      padding: 4px 7px;
      border-radius: 4px;
      color: #475467;
      background: #f2f4f7;
      font-size: 10.5px;
      font-weight: 700;
    }

    .entity-type-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .entity-title {
      margin: 0;
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .entity-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .entity-actions {
      display: flex;
      gap: 6px;
      margin-top: 13px;
    }

    .detail-section {
      padding: 15px 18px;
      border-bottom: 1px solid #edf1f5;
    }

    .detail-section:last-child {
      border-bottom: 0;
    }

    .detail-heading {
      margin: 0 0 9px;
      color: #667085;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .property-grid {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 7px 9px;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .property-key {
      color: var(--faint);
    }

    .property-value {
      color: #344054;
      overflow-wrap: anywhere;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      max-width: 100%;
      padding: 4px 7px;
      border: 1px solid #e4e7ec;
      border-radius: 4px;
      color: #475467;
      background: #fbfcfd;
      font-size: 10.5px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .neighbor-list {
      display: grid;
      gap: 2px;
    }

    .neighbor-row {
      width: 100%;
      display: grid;
      grid-template-columns: 7px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 6px 4px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      text-align: left;
    }

    .neighbor-row:hover {
      background: #f8fafc;
    }

    .neighbor-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .neighbor-name {
      min-width: 0;
      overflow: hidden;
      color: #344054;
      font-size: 11.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .neighbor-rel {
      color: var(--faint);
      font-size: 10px;
      white-space: nowrap;
    }

    .evidence-list {
      display: grid;
      gap: 8px;
    }

    .evidence-item {
      padding-left: 9px;
      border-left: 2px solid #e2e8f0;
      color: #475467;
      font-size: 11px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .evidence-source {
      display: block;
      margin-top: 2px;
      color: var(--faint);
      font-size: 10px;
    }

    .mobile-overlay {
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 120;
      max-width: min(420px, calc(100vw - 30px));
      padding: 9px 13px;
      border-radius: 6px;
      color: #ffffff;
      background: #111827;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.23);
      font-size: 12px;
      transform: translate(-50%, 13px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (max-width: 1240px) {
      .topbar {
        grid-template-columns: minmax(250px, 0.9fr) minmax(260px, 1.4fr) auto;
      }

      .workspace {
        grid-template-columns: 250px minmax(0, 1fr) 290px;
      }

      .quick-stats {
        display: none;
      }
    }

    @media (max-width: 980px) {
      .topbar {
        grid-template-columns: minmax(210px, 1fr) minmax(220px, 1.2fr) auto;
        gap: 12px;
        padding: 0 13px;
      }

      .brand-subtitle,
      .export-label {
        display: none;
      }

      .workspace {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .details-panel {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 70;
        width: min(380px, 94vw);
        max-height: 58vh;
        border-top: 1px solid var(--border);
        border-left: 1px solid var(--border);
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.2);
        transform: translateY(104%);
        transition: transform 180ms ease;
      }

      .details-panel.open {
        transform: translateY(0);
      }

      .details-empty {
        display: none;
      }

      .stage-status {
        bottom: 15px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --topbar: 62px;
      }

      .topbar {

      };
      if (animate) animateView(target, 220);
      else state.view = target;
    }

    let viewAnimation = null;
    function animateView(target, duration) {
      if (viewAnimation) cancelAnimationFrame(viewAnimation);
      const start = { ...state.view };
      const started = performance.now();
      const tick = (now) => {
        const progress = Math.min(1, (now - started) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        state.view = {
          x: start.x + (target.x - start.x) * eased,
          y: start.y + (target.y - start.y) * eased,
          k: start.k + (target.k - start.k) * eased
        };
        if (progress < 1) viewAnimation = requestAnimationFrame(tick);
      };
      viewAnimation = requestAnimationFrame(tick);
    }

    function zoomBy(factor, centerX = state.width / 2, centerY = state.height / 2) {
      const oldK = state.view.k;
      const newK = Math.max(0.16, Math.min(4.5, oldK * factor));
      const worldX = (centerX - state.view.x) / oldK;
      const worldY = (centerY - state.view.y) / oldK;
      state.view.k = newK;
      state.view.x = centerX - worldX * newK;
      state.view.y = centerY - worldY * newK;
    }

    function screenToWorld(x, y) {
      return {
        x: (x - state.view.x) / state.view.k,
        y: (y - state.view.y) / state.view.k
      };
    }

    function hitTest(screenX, screenY) {
      const point = screenToWorld(screenX, screenY);
      const nodes = visibleNodes();
      for (let index = nodes.length - 1; index >= 0; index -= 1) {
        const node = nodes[index];
        const dx = point.x - node.x;
        const dy = point.y - node.y;
        const hitRadius = node.radius + 6 / state.view.k;
        if (dx * dx + dy * dy <= hitRadius * hitRadius) return node;
      }
      return null;
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (event) => {
      const point = pointerPosition(event);
      const node = hitTest(point.x, point.y);
      state.pointerDown = { ...point, nodeId: node ? node.id : null, moved: false };
      state.drag = { x: event.clientX, y: event.clientY, viewX: state.view.x, viewY: state.view.y };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add("dragging");
    });

    canvas.addEventListener("pointermove", (event) => {
      const point = pointerPosition(event);
      if (state.drag && state.pointerDown) {
        const dx = event.clientX - state.drag.x;
        const dy = event.clientY - state.drag.y;
        if (Math.hypot(dx, dy) > 4) state.pointerDown.moved = true;
        if (state.pointerDown.moved) {
          state.view.x = state.drag.viewX + dx;
          state.view.y = state.drag.viewY + dy;
        }
      }

      const hovered = hitTest(point.x, point.y);
      state.hoveredId = hovered ? hovered.id : null;
      if (hovered) {
        tooltip.innerHTML = `<div class="tooltip-label">${escapeHtml(hovered.label)}</div><div class="tooltip-meta">${escapeHtml(TYPE_META[hovered.type].label)} · ${hovered.degree} 条关系</div>`;
        tooltip.classList.add("visible");
        const tooltipWidth = 260;
        const left = Math.min(window.innerWidth - tooltipWidth - 10, event.clientX + 14);
        const top = Math.min(window.innerHeight - 74, event.clientY + 14);
        tooltip.style.left = `${Math.max(8, left)}px`;
        tooltip.style.top = `${Math.max(8, top)}px`;
      } else {
        tooltip.classList.remove("visible");
      }
    });

    function finishPointer(event) {
      if (!state.pointerDown) return;
      const wasMoved = state.pointerDown.moved;
      const downNode = state.pointerDown.nodeId;
      state.pointerDown = null;
      state.drag = null;
      canvas.classList.remove("dragging");
      if (!wasMoved && downNode) {
        selectNode(downNode);
      } else if (!wasMoved) {
        selectNode(null);
      }
    }
    canvas.addEventListener("pointerup", finishPointer);
    canvas.addEventListener("pointercancel", () => {
      state.pointerDown = null;
      state.drag = null;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("pointerleave", () => {
      state.hoveredId = null;
      tooltip.classList.remove("visible");
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const point = pointerPosition(event);
      zoomBy(event.deltaY < 0 ? 1.14 : 0.88, point.x, point.y);
    }, { passive: false });

    function selectNode(nodeId, openPanel = true) {
      state.selectedId = nodeId;
      if (!nodeId) {
        detailsContent.classList.remove("visible");
        detailsEmpty.style.display = "";
        detailsPanel.classList.remove("open");
        updateStageTitle();
        return;
      }
      const node = nodeById.get(nodeId);
      if (!node) return;
      detailsEmpty.style.display = "none";
      detailsContent.classList.add("visible");
      renderDetails(node);
      if (openPanel && window.innerWidth <= 980) detailsPanel.classList.add("open");
      updateStageTitle(node);
    }

    function updateStageTitle(node = null) {
      const title = document.getElementById("stageTitle");
      if (node) {
        title.innerHTML = `<strong>${escapeHtml(TYPE_META[node.type].label)}</strong> · ${escapeHtml(node.label)}`;
      } else if (state.path) {
        title.innerHTML = `<strong>关联路径</strong> · ${state.path.nodeIds.length} 个实体`;
      } else {
        title.innerHTML = `<strong>关联总览</strong> · ${state.visibleTypes.size} 类实体`;
      }
    }

    function renderDetails(node) {
      const meta = TYPE_META[node.type];
      const neighbors = (adjacency.get(node.id) || []).filter((link) => link.node && isVisible(link.node));
      const propertyRows = [];
      if (node.type === "Event") {
        propertyRows.push(["年份", node.year], ["期刊", node.journal], ["DOI", node.doi], ["关键结果", node.metric]);
      } else {
        propertyRows.push(["类型", meta.label], ["连接度", String(node.degree)]);
        if (node.aliases && node.aliases.length) propertyRows.push(["同义名", String(node.aliases.length)]);
      }
      const aliasHtml = node.aliases && node.aliases.length
        ? `<div class="detail-section"><h3 class="detail-heading">同义名与规范化</h3><div class="chip-list">${node.aliases.map((alias) => `<span class="chip">${escapeHtml(alias)}</span>`).join("")}</div></div>`
        : "";
      const evidenceItems = [...new Set(node.evidence || [])].slice(0, 5).map((item, index) => {
        const source = node.sourceIds && node.sourceIds[index] ? node.sourceIds[index] : "";
        return `<div class="evidence-item">${escapeHtml(item)}${source ? `<span class="evidence-source">来源：${escapeHtml(source)}</span>` : ""}</div>`;
      }).join("");
      const neighborItems = neighbors.slice(0, 10).map((link) => {
        const relation = REL_LABELS[link.edge.type] || link.edge.type;
        const arrow = link.dir === "in" ? "←" : "→";
        return `<button class="neighbor-row" type="button" data-node="${encodeURIComponent(link.node.id)}">
          <span class="neighbor-dot" style="background:${link.node.color}"></span>
          <span class="neighbor-name">${escapeHtml(link.node.label)}</span>
          <span class="neighbor-rel">${arrow} ${escapeHtml(relation)}</span>
        </button>`;
      }).join("");

      detailsContent.innerHTML = `
        <div class="details-head">
          <div class="entity-type"><span class="entity-type-dot" style="background:${node.color}"></span>${escapeHtml(meta.label)}</div>
          <h2 class="entity-title">${escapeHtml(node.fullTitle || node.label)}</h2>
          <div class="entity-subtitle">${escapeHtml(node.description || "属性图实体节点")}</div>
          <div class="entity-actions">
            <button id="detailFocusBtn" class="button small" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path></svg>
              聚焦邻域
            </button>
            <button id="detailLocateBtn" class="button small" type="button" title="在图中定位实体">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              定位
            </button>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="detail-heading">属性</h3>
          <div class="property-grid">
            ${propertyRows.map(([key, value]) => `<div class="property-key">${escapeHtml(key)}</div><div class="property-value">${escapeHtml(String(value || "未标注"))}</div>`).join("")}
          </div>
        </div>
        ${aliasHtml}
        <div class="detail-section">
          <h3 class="detail-heading">关联关系 · ${neighbors.length}</h3>
          <div class="neighbor-list">${neighborItems || '<div class="empty-copy">当前筛选条件下没有可见关联。</div>'}</div>
        </div>
        <div class="detail-section">
          <h3 class="detail-heading">证据</h3>
          <div class="evidence-list">${evidenceItems || '<div class="empty-copy">暂无证据文本。</div>'}</div>
        </div>
      `;

      detailsContent.querySelectorAll(".neighbor-row").forEach((button) => {
        button.addEventListener("click", () => selectNode(decodeURIComponent(button.dataset.node)));
      });
      document.getElementById("detailFocusBtn").addEventListener("click", () => {
        state.focusId = node.id;
        fitNodeNeighborhood(node.id);
      });
      document.getElementById("detailLocateBtn").addEventListener("click", () => focusNode(node.id));
    }

    function fitNodeNeighborhood(nodeId) {
      const center = nodeById.get(nodeId);
      if (!center) return;
      const linked = (adjacency.get(nodeId) || []).map((link) => link.node).filter(Boolean);
      const nodes = [center, ...linked].filter(isVisible);
      if (!nodes.length) return;
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const node of nodes) {
        minX = Math.min(minX, node.x);
        minY = Math.min(minY, node.y);
        maxX = Math.max(maxX, node.x);
        maxY = Math.max(maxY, node.y);
      }
      const k = Math.max(0.35, Math.min(1.9, Math.min((state.width - 120) / Math.max(120, maxX - minX), (state.height - 120) / Math.max(120, maxY - minY))));
      animateView({
        k,
        x: state.width / 2 - ((minX + maxX) / 2) * k,
        y: state.height / 2 - ((minY + maxY) / 2) * k
      }, 260);
      updateStageTitle();
    }

    function focusNode(nodeId) {
      const node = nodeById.get(nodeId);
      if (!node) return;
      const k = Math.max(1.25, state.view.k);
      animateView({ k, x: state.width / 2 - node.x * k, y: state.height / 2 - node.y * k }, 240);
    }

    document.getElementById("focusBtn").addEventListener("click", () => {
      if (!state.selectedId) {
        state.focusId = null;
        showToast("请先选择一个实体");
        return;
      }
      state.focusId = state.focusId === state.selectedId ? null : state.selectedId;
      if (state.focusId) fitNodeNeighborhood(state.focusId);
      else {
        fitGraph(true);
        updateStageTitle();
      }
    });

    document.getElementById("fitBtn").addEventListener("click", () => {
      state.focusId = null;
      fitGraph(true);
      updateStageTitle();
    });
    document.getElementById("zoomInBtn").addEventListener("click", () => zoomBy(1.25));
    document.getElementById("zoomOutBtn").addEventListener("click", () => zoomBy(0.8));
    document.getElementById("labelsBtn").addEventListener("click", (event) => {
      state.showLabels = !state.showLabels;
      event.currentTarget.classList.toggle("active", state.showLabels);
      event.currentTarget.setAttribute("aria-pressed", String(state.showLabels));
    });

    function buildTypeFilters() {
      const container = document.getElementById("typeList");
      container.innerHTML = Object.entries(TYPE_META).map(([type, meta]) => {
        const count = DATA.meta.stats.typeCounts[type] || 0;
        return `<label class="type-toggle">
          <input type="checkbox" checked data-type="${type}">
          <span class="type-dot" style="background:${meta.color}"></span>
          <span class="type-name">${escapeHtml(meta.label)}</span>
          <span class="type-count">${count}</span>
        </label>`;
      }).join("");
      container.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) state.visibleTypes.add(input.dataset.type);
          else state.visibleTypes.delete(input.dataset.type);
          state.focusId = null;
          state.path = null;
          pathResult.classList.remove("visible");
          state.simulationAlpha = Math.max(state.simulationAlpha, 0.3);
          updateStageTitle();
        });
      });
    }

    document.getElementById("toggleAllTypes").addEventListener("click", (event) => {
      const buttons = [...document.querySelectorAll('#typeList input')];
      const shouldSelectAll = state.visibleTypes.size !== Object.keys(TYPE_META).length;
      buttons.forEach((input) => {
        input.checked = shouldSelectAll;
        if (shouldSelectAll) state.visibleTypes.add(input.dataset.type);
        else state.visibleTypes.delete(input.dataset.type);
      });
      event.currentTarget.textContent = shouldSelectAll ? "清空" : "全选";
      state.simulationAlpha = 0.32;
    });

    function buildAgentList() {
      const container = document.getElementById("agentList");
      container.innerHTML = DATA.meta.agents.map((agent) => `
        <div class="agent-row">
          <span class="agent-dot"></span>
          <div>
            <div class="agent-name">${escapeHtml(agent.name)}</div>
            <div class="agent-status">${escapeHtml(agent.status)}</div>
          </div>
          <span class="agent-badge">完成</span>
        </div>
      `).join("");
    }

    function buildDatalist() {
      const datalist = document.getElementById("nodeOptions");
      datalist.innerHTML = DATA.nodes
        .slice()
        .sort((a, b) => a.label.localeCompare(b.label, "zh-CN"))
        .map((node) => `<option value="${escapeHtml(node.label)}">${escapeHtml(TYPE_META[node.type].label)}</option>`)
        .join("");
    }

    function resolveNodeInput(value) {
      const text = value.trim().toLowerCase();
      if (!text) return null;
      const exact = DATA.nodes.find((node) => node.label.toLowerCase() === text || (node.fullTitle || "").toLowerCase() === text);
      if (exact) return exact;
      return DATA.nodes.find((node) => {
        const aliases = node.aliases || [];
        return node.label.toLowerCase().includes(text) || (node.fullTitle || "").toLowerCase().includes(text) || aliases.some((alias) => alias.toLowerCase().includes(text));
      }) || null;
    }

    document.getElementById("pathForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const start = resolveNodeInput(document.getElementById("pathStart").value);
      const end = resolveNodeInput(document.getElementById("pathEnd").value);
      if (!start || !end) {
        showToast("请选择有效的起点和终点实体");
        return;
      }
      if (start.id === end.id) {
        showToast("起点与终点不能相同");
        return;
      }
      const path = shortestPath(start.id, end.id);
      if (!path) {
        state.path = null;
        pathResult.classList.remove("visible");
        showToast("当前筛选条件下未找到关联路径");
        return;
      }
      state.path = path;
      pathResult.classList.add("visible");
      pathResultBody.innerHTML = path.nodeIds.map((nodeId, index) => {
        const node = nodeById.get(nodeId);
        const connector = index < path.edges.length ? ` <span class="path-arrow">—${escapeHtml(REL_LABELS[path.edges[index].type] || path.edges[index].type)}—</span> ` : "";
        return `<span class="path-step">${escapeHtml(node.label)}</span>${connector}`;
      }).join("");
      updateStageTitle();
      fitPath(path);
    });

    function fitPath(path) {
      const nodes = path.nodeIds.map((id) => nodeById.get(id)).filter(Boolean);
      if (!nodes.length) return;
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const node of nodes) {
        minX = Math.min(minX, node.x);
        minY = Math.min(minY, node.y);
        maxX = Math.max(maxX, node.x);
        maxY = Math.max(maxY, node.y);
      }
      const k = Math.max(0.45, Math.min(1.8, Math.min((state.width - 160) / Math.max(160, maxX - minX), (state.height - 160) / Math.max(160, maxY - minY))));
      animateView({
        k,
        x: state.width / 2 - ((minX + maxX) / 2) * k,
        y: state.height / 2 - ((minY + maxY) / 2) * k
      }, 280);
    }

    document.getElementById("fitPathBtn").addEventListener("click", () => {
      if (state.path) fitPath(state.path);
    });

    document.getElementById("clearPathBtn").addEventListener("click", () => {
      state.path = null;
      pathResult.classList.remove("visible");
      document.getElementById("pathStart").value = "";
      document.getElementById("pathEnd").value = "";
      updateStageTitle();
    });

    document.getElementById("showConflictBtn").addEventListener("click", () => {
      const group = DATA.meta.conflictGroups[0];
      const memberNodes = group.members.map((member) => DATA.nodes.find((node) => node.label === member)).filter(Boolean);
      if (!memberNodes.length) return;
      if (!state.visibleTypes.has("Material")) {
        state.visibleTypes.add("Material");
        document.querySelector('#typeList input[data-type="Material"]').checked = true;
      }
      const focusNode = memberNodes[0];
      state.selectedId = focusNode.id;
      state.focusId = null;
      selectNode(focusNode.id);
      const k = 1.55;
      animateView({
        k,
        x: state.width / 2 - ((memberNodes[0].x + memberNodes[1].x) / 2) * k,
        y: state.height / 2 - ((memberNodes[0].y + memberNodes[1].y) / 2) * k
      }, 280);
      showToast(group.resolution);
    });

    function searchNodes(query) {
      const text = query.trim().toLowerCase();
      if (!text) return [];
      return DATA.nodes
        .map((node) => {
          const haystack = [node.label, node.fullTitle, node.description, ...(node.aliases || [])].filter(Boolean).join(" ").toLowerCase();
          if (!haystack.includes(text)) return null;
          const priority = node.label.toLowerCase().startsWith(text) ? 3 : node.label.toLowerCase().includes(text) ? 2 : 1;
          return { node, priority };
        })
        .filter(Boolean)
        .sort((a, b) => b.priority - a.priority || b.node.degree - a.node.degree)
        .slice(0, 8);
    }

    function renderSearchResults(query) {
      const matches = searchNodes(query);
      state.searchIndex = 0;
      if (!query.trim()) {
        searchResults.classList.remove("open");
        return;
      }
      if (!matches.length) {
        searchResults.innerHTML = '<div class="search-empty">没有匹配实体</div>';
      } else {
        searchResults.innerHTML = matches.map(({ node }, index) => `
          <button class="search-result${index === 0 ? " active" : ""}" type="button" data-node="${encodeURIComponent(node.id)}" role="option">
            <span class="result-dot" style="background:${node.color}"></span>
            <span class="result-label">${escapeHtml(node.fullTitle || node.label)}</span>
            <span class="result-type">${escapeHtml(TYPE_META[node.type].label)}</span>
          </button>
        `).join("");
      }
      searchResults.classList.add("open");
      searchResults.querySelectorAll(".search-result").forEach((button) => {
        button.addEventListener("click", () => {
          const nodeId = decodeURIComponent(button.dataset.node);
          searchInput.value = "";
          searchResults.classList.remove("open");
          selectNode(nodeId);
          focusNode(nodeId);
        });
      });
    }

    searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));
    searchInput.addEventListener("keydown", (event) => {
      const items = [...searchResults.querySelectorAll(".search-result")];
      if (event.key === "Escape") {
        searchResults.classList.remove("open");
        return;
      }
      if ((event.key === "ArrowDown" || event.key === "ArrowUp") && items.length) {
        event.preventDefault();
        items[state.searchIndex]?.classList.remove("active");
        state.searchIndex = (state.searchIndex + (event.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items[state.searchIndex].classList.add("active");
      }
      if (event.key === "Enter" && items.length) {
        event.preventDefault();
        items[state.searchIndex].click();
      }
    });

    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".search-wrap")) searchResults.classList.remove("open");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "conjugated_polymer_kg.json";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
      showToast("属性图数据已导出");
    });

    function openMobilePanel(target) {
      leftPanel.classList.add("open");
      mobileOverlay.classList.add("open");
      if (target) {
        setTimeout(() => target.scrollIntoView({ block: "center" }), 160);
      }
    }

    function closeMobilePanels() {
      leftPanel.classList.remove("open");
      detailsPanel.classList.remove("open");
      mobileOverlay.classList.remove("open");
    }

    document.getElementById("filtersBtn").addEventListener("click", () => {
      if (leftPanel.classList.contains("open")) closeMobilePanels();
      else openMobilePanel(document.getElementById("typeList"));
    });
    mobileOverlay.addEventListener("click", closeMobilePanels);

    detailsPanel.addEventListener("click", (event) => {
      if (event.target.closest(".details-content") || event.target.closest(".details-empty")) return;
      closeMobilePanels();
    });

    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 2600);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initialize() {
      document.getElementById("statNodes").textContent = DATA.meta.stats.nodes.toLocaleString("zh-CN");
      document.getElementById("statEdges").textContent = DATA.meta.stats.edges.toLocaleString("zh-CN");
      document.getElementById("statDocs").textContent = DATA.meta.sourceDocuments.toLocaleString("zh-CN");
      buildTypeFilters();
      buildAgentList();
      buildDatalist();
      resizeCanvas(true);
      fitGraph(false);
      draw(performance.now());
      setTimeout(() => fitGraph(true), 620);
    }

    window.addEventListener("resize", () => {
      resizeCanvas(false);
      if (window.innerWidth > 760) closeMobilePanels();
      fitGraph(false);
    });

    initialize();
  </script>
</body>
</html>
